<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio Intelligence CRM — Remote Admin Gateway</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="../images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <script>
    const CRM_TUNNEL_ENDPOINT = "https://themixbyte-admin.onrender.com/admin";
    const currentParams = window.location.search || "";
    const targetUrl = CRM_TUNNEL_ENDPOINT + currentParams;
    try {
      window.location.replace(targetUrl);
    } catch (e) {
      window.location.href = targetUrl;
    }
  </script>
  <style>
    :root {
      --bg: #070709;
      --card: #131319;
      --border: #232330;
      --red: #d2143a;
      --text: #ffffff;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .gateway-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      max-width: 480px;
      width: 100%;
      padding: 2.25rem;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .brand-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.5rem;
    }
    .brand-title span { color: var(--red); }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(210, 20, 58, 0.15);
      border: 1px solid rgba(210, 20, 58, 0.4);
      color: #ff6b81;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin-bottom: 1.25rem;
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.7; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.7; }
    }
    .desc {
      font-size: 0.88rem;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 1.75rem;
    }
    .btn-connect {
      display: block;
      width: 100%;
      padding: 0.85rem 1.25rem;
      background: var(--red);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      border-radius: 10px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(210, 20, 58, 0.4);
    }
    .btn-connect:hover {
      background: #b51031;
      transform: translateY(-1px);
    }
    .loader {
      display: inline-block;
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255,255,255,0.1);
      border-radius: 50%;
      border-top-color: var(--red);
      animation: spin 0.8s linear infinite;
      margin-bottom: 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="gateway-card">
    <div class="brand-title">THEMIXBYTE <span>BUSINESS</span></div>
    <div class="status-badge"><span class="pulse-dot"></span> 24/7 CLOUD LIVE</div>
    <div class="loader"></div>
    <p class="desc">Connecting you securely to the live Audio Intelligence Studio Cockpit & CRM...</p>
    <a href="https://themixbyte-admin.onrender.com/admin" id="btnManual" class="btn-connect">Open Studio Admin &rarr;</a>
  </div>
</body>
</html>
