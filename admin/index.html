<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio Intelligence CRM — Remote Admin Gateway</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="../images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <script>
    const CRM_TUNNEL_ENDPOINT = "https://sao-spider-celebration-indiana.trycloudflare.com/admin";
    const currentParams = window.location.search || "";
    const targetUrl = CRM_TUNNEL_ENDPOINT + currentParams;
    try {
      window.location.replace(targetUrl);
    } catch (e) {
      window.location.href = targetUrl;
    }
  </script>
  <style>
    :root {
      --bg: #070709;
      --card: #131319;
      --border: #232330;
      --red: #d2143a;
      --text: #ffffff;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .gateway-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 2.5rem 2rem;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.7);
    }
    .brand-title {
      font-family: "Space Grotesk", sans-serif;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 0.4rem;
    }
    .brand-title span { color: var(--red); }
    .subtitle {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 2rem;
    }
    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid #282838;
      border-top-color: var(--red);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1.5rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status-msg {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
    }
    .btn-portal {
      display: inline-block;
      width: 100%;
      background: var(--red);
      color: #fff;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 0.85rem 1rem;
      border-radius: 8px;
      text-decoration: none;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(210, 20, 58, 0.4);
    }
    .btn-portal:hover {
      background: #b50f30;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="gateway-card">
    <div class="spinner"></div>
    <div class="brand-title">AUDIO INTELLIGENCE <span>CRM</span></div>
    <div class="subtitle">Secure Stage Distribution & Hardware Portal</div>
    <div class="status-msg">Connecting to Studio CRM...</div>
    <a id="portalLink" class="btn-portal" href="https://sao-spider-celebration-indiana.trycloudflare.com/admin">
      Open Admin Dashboard &rarr;
    </a>
  </div>
  <script>
    document.getElementById("portalLink").href = targetUrl;
  </script>
</body>
</html>
